name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag matches crate version
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"slake","version":"\([^"]*\)".*/\1/p')"

          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package binary
        run: |
          set -euo pipefail
          NAME="slake-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$NAME"
          # slake plus the deprecated cooldown-guard alias.
          cp target/release/slake target/release/cooldown-guard README.md LICENSE CHANGELOG.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
