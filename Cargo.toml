[package]
name = "slake"
version = "0.5.0"
edition = "2024"
description = "Minimum-interval guard for cron jobs and recurring commands"
license = "AGPL-3.0-only"
repository = "https://github.com/GreyforgeLabs/slake"
homepage = "https://greyforge.tech"
keywords = ["cli", "cron", "scheduler", "sqlite", "rust"]
categories = ["command-line-utilities"]
rust-version = "1.88"
default-run = "slake"

[[bin]]
name = "slake"
path = "src/main.rs"

# Deprecated alias kept so existing cron lines keep working; it will be removed
# in a future release.
[[bin]]
name = "cooldown-guard"
path = "src/bin/cooldown-guard.rs"

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.6.0", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
directories = "=6.0.0"
humantime = "=2.3.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.184"

[dev-dependencies]
assert_cmd = "=2.2.0"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
